# LasTresB · proxy a la web (contenedor en 127.0.0.1:3000). certbot agrega el bloque HTTPS.
upstream lastresb_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    server_name vps.lastresb.com.co;

    # Archivos con hash de Next: inmutables, caché larga.
    location /_next/static/ {
        proxy_pass http://lastresb_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://lastresb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # IP real del visitante: la app la guarda en consentimientos (regla 5) y auditoría.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vps.lastresb.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vps.lastresb.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = vps.lastresb.com.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vps.lastresb.com.co;
    return 404; # managed by Certbot


}