# LasTresB · producción. Canónico: https://www.lastresb.com.co (como en Vercel, para no perder SEO).
# Mantenimiento: si existe /var/www/mantenimiento/activo, www responde 503 con /var/www/mantenimiento/index.html.

upstream lastresb_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS www (menos el reto de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name lastresb.com.co www.lastresb.com.co vps.lastresb.com.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.lastresb.com.co$request_uri; }
}

# Dominio sin www → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lastresb.com.co;
    ssl_certificate /etc/letsencrypt/live/lastresb.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastresb.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.lastresb.com.co$request_uri;
}

# Subdominio de prueba → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.lastresb.com.co;
    ssl_certificate /etc/letsencrypt/live/vps.lastresb.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.lastresb.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.lastresb.com.co$request_uri;
}

# Sitio
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lastresb.com.co;
    ssl_certificate /etc/letsencrypt/live/lastresb.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastresb.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 503 @mantenimiento;
    location @mantenimiento {
        root /var/www/mantenimiento;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
    }

    # Archivos con hash de Next: inmutables, caché larga.
    location /_next/static/ {
        if (-f /var/www/mantenimiento/activo) { return 503; }
        proxy_pass http://lastresb_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        if (-f /var/www/mantenimiento/activo) { return 503; }
        proxy_pass http://lastresb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # IP real del visitante: la app la guarda en consentimientos (regla 5) y auditoría.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
